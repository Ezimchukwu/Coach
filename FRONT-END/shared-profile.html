<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Profile | Coaching Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/shared-profile.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="bg-primary text-white py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col">
                    <h1 class="h3 mb-0">Coaching Profile</h1>
                </div>
                <div class="col-auto">
                    <a href="login.html" class="btn btn-outline-light">Sign In</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row">
            <!-- Profile Card -->
            <div class="col-md-8 mx-auto">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <!-- Profile Header -->
                        <div class="text-center mb-4">
                            <div class="profile-photo-container mb-3">
                                <img src="" alt="Profile Photo" id="profilePhoto" class="rounded-circle profile-photo">
                            </div>
                            <h2 class="h4 mb-1" id="profileName">Loading...</h2>
                            <p class="text-muted mb-3" id="profileLocation">Loading...</p>
                        </div>

                        <!-- Profile Details -->
                        <div class="profile-details">
                            <div class="mb-4">
                                <h5 class="mb-3">About</h5>
                                <p id="profileBio" class="text-muted">Loading...</p>
                            </div>

                            <div class="mb-4" id="contactSection">
                                <h5 class="mb-3">Contact Information</h5>
                                <div id="emailContainer" class="d-none">
                                    <p><i class="fas fa-envelope me-2"></i><span id="profileEmail">Loading...</span></p>
                                </div>
                                <div id="phoneContainer" class="d-none">
                                    <p><i class="fas fa-phone me-2"></i><span id="profilePhone">Loading...</span></p>
                                </div>
                            </div>

                            <div class="mb-4" id="achievementsSection">
                                <h5 class="mb-3">Achievements</h5>
                                <div id="achievementsList" class="list-group">
                                    <!-- Achievements will be loaded here -->
                                </div>
                            </div>
                        </div>

                        <!-- Call to Action -->
                        <div class="text-center mt-4">
                            <a href="register.html" class="btn btn-primary">Get Started with Coaching</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2024 Coaching Platform. All rights reserved.</p>
        </div>
    </footer>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared-profile.js"></script>
</body>
</html>
